<style>
/* Consola de escritorio: barra de pestañas arriba, cada pestaña una tarea del equipo receptor */
:root{
  --azul:#1f4e79; --azul-2:#2c6aa3; --azul-suave:#e6eef6;
  --fondo:#f3f5f8; --sup:#ffffff; --texto:#1b2633; --tenue:#5a6879; --linea:#d6dee8;
  --ok:#1f7a4d; --ok-suave:#e3f3ea; --alerta:#a55a00; --alerta-suave:#fdf1e2; --mal:#b3261e; --mal-suave:#fbe9e7;
  --sombra:0 1px 2px rgba(16,32,52,.06),0 4px 14px rgba(16,32,52,.06); --r:12px;
  --f:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --azul:#8fb8e3; --azul-2:#a9c9ec; --azul-suave:#1d2c3d; --fondo:#0f1620; --sup:#172230; --texto:#e5ebf2; --tenue:#9aa8b8; --linea:#2a3a4d;
  --ok:#6fcf9b; --ok-suave:#143024; --alerta:#f0b45c; --alerta-suave:#33260f; --mal:#ff8a80; --mal-suave:#3a1a18; --sombra:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --azul:#8fb8e3; --azul-2:#a9c9ec; --azul-suave:#1d2c3d; --fondo:#0f1620; --sup:#172230; --texto:#e5ebf2; --tenue:#9aa8b8; --linea:#2a3a4d;
  --ok:#6fcf9b; --ok-suave:#143024; --alerta:#f0b45c; --alerta-suave:#33260f; --mal:#ff8a80; --mal-suave:#3a1a18; --sombra:none; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:15.5px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sup);border-bottom:1px solid var(--linea)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.marca{font-weight:700;color:var(--azul);font-size:18px}
.marca small{display:block;font-weight:500;color:var(--tenue);font-size:12.5px}
.esp{flex:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--tenue);font-weight:600;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--azul);border-bottom-color:var(--azul)}
main{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:23px;line-height:1.25;margin:0 0 6px;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:13px;margin:16px 0 8px;color:var(--tenue);text-transform:uppercase;letter-spacing:.6px}
p{margin:0 0 10px}
.tenue{color:var(--tenue)}
.tarjeta{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra);min-width:0}
.pila{display:grid;gap:14px}

.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:10px;border:1px solid var(--linea);background:var(--sup);font-weight:600;cursor:pointer}
.btn.pri{background:var(--azul);border-color:var(--azul);color:var(--sup)}
.btn.chico{min-height:32px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap;border:1px solid transparent}

.chip.activo,.chip.borrador{background:var(--alerta-suave);color:var(--alerta)}

.chip.retirado{background:var(--mal-suave);color:var(--mal)}
.chip.noacepto,.chip.pendiente,.chip.corregido{background:var(--fondo);color:var(--tenue);border-color:var(--linea)}
.chip.corregido{color:var(--azul);border-color:var(--azul)}
.aviso{padding:10px 14px;border-radius:10px;background:var(--alerta-suave);color:var(--alerta)}
.aviso.ok{background:var(--ok-suave);color:var(--ok)}
.aviso.mal{background:var(--mal-suave);color:var(--mal)}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cifra{background:var(--sup);border:1px solid var(--linea);border-radius:10px;padding:10px 14px}
.cifra b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.cifra span{color:var(--tenue);font-size:13.5px}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
th{color:var(--tenue);font-weight:650;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.barra{height:10px;border-radius:6px;background:var(--fondo);border:1px solid var(--linea);overflow:hidden;min-width:120px}
.barra i{display:block;height:100%;background:var(--azul)}
.zona{border:2px dashed var(--linea);border-radius:12px;padding:22px;text-align:center;color:var(--tenue)}
.zona.sobre{border-color:var(--azul);background:var(--azul-suave)}
textarea{width:100%;min-height:90px;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--fondo);line-height:1.45}
input[type=text],select{min-height:38px;padding:6px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--fondo)}
pre.copia{white-space:pre-wrap;background:var(--fondo);border:1px solid var(--linea);border-radius:10px;padding:12px;font:14px/1.5 var(--mono);margin:0}
.pasos{counter-reset:p;display:grid;gap:10px;margin:0;padding:0;list-style:none}
.pasos li{counter-increment:p;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.pasos li::before{content:counter(p);width:30px;height:30px;border-radius:50%;background:var(--azul);color:var(--sup);display:grid;place-items:center;font-weight:700;font-size:14px}
.pasos b{display:block}
.trans{border:1px dashed var(--azul);background:var(--azul-suave);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.item{border-top:1px solid var(--linea);padding-top:12px;margin-top:12px}
.item:first-child{border-top:0;margin-top:0;padding-top:0}
audio{width:100%;max-width:420px;height:36px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--texto);color:var(--fondo);padding:10px 16px;border-radius:10px;z-index:30}
textarea#portapapeles{position:fixed;left:-9999px;top:0;opacity:0}
</style>
</head>

<script>

const INST = {"version": "V2.0 17/7/2026", "titulo": "Análisis de determinantes de salud con enfoque territorial, en población de 18 años o más. República de Panamá. Años 2026-2027", "investigadores": "Investigadores: Dra. Iranela Miranda, Dr.Gresky Gutiérrez,Dra. María Mercedes Castrejón, Dra. Luz Romero, Dr.Jaime Sevillano, Dr. Manuel Nazas, Dr. Juan Carlos Luria, Mgter Iset Trujillo, Dr. Heraclides Gómez, Dra. Tamara Villafañez, Licda. Muriel Rangel y Licda. Ariadna Candanedo, Dra. Olga Quirós, Dr. Alexis Castillo y Licda. Shanira Pineda.", "parte1_instruccion": "Parte I. Responda cada pregunta marcando la respuesta seleccionada.", "parte1": [{"letra": "A", "titulo": "Preguntas sobre aspectos sociodemográficos", "preguntas": [{"texto": "El sexo al que pertenece es:", "opciones": ["Hombre", "Mujer"]}, {"texto": "Indique a qué grupo de edad pertenece:", "opciones": ["18 a 24 años", "25 a 34 años", "35 a 44 años", "45 a 54 años", "55 a 64 años", "65 años o más"]}, {"texto": "Coloque el Nivel Educativo al que pertenece:", "opciones": ["Sin estudios formales", "Primaria", "Secundaria", "Técnico", "Licenciatura", "Postgrado o especialización", "Doctorado"]}, {"texto": "Indique su Nacionalidad:", "opciones": ["Panameña", "Extranjero/a"]}, {"texto": "Marque la situación actual en cuanto a su ocupación:", "opciones": ["Empleado: del gobierno, de empresa privada, de una cooperativa, de servicio doméstico o de una organización sin fines de lucro.", "Trabajador por cuenta propia: que ha desarrollado su propio negocio o empresa o ejerce por su cuenta propia su profesión. No tiene a su cargo otros empleados.", "Patrono o Dueño: persona que ha explotado su propia empresa, solo o asociado, ejerce por su cuenta una profesión, pero tiene a su cargo uno o más empleados que reciben una remuneración.", "Trabajador Familiar: ejerce una profesión no remunerada, en una empresa o negocio explotado por un miembro de su familia.", "Miembro de una Cooperativa de Producción: participa de una ene usted acceso a agua potable en su hogar de manera regular?", "opciones": ["Sí", "No"]}, {"texto": "¿De dónde obtiene el agua en su hogar?", "opciones": ["Acueducto público (IDAAN)", "Acueducto Particular dentro de la vivienda.", "Pluma o toma de agua comunitaria.", "Pozos", "Agua de río, quebrada o manantial, sin tratar.", "Agua de lluvia", "Agua embotellada", "Carros cisternas"]}, {"texto": "¿Cuál es el sistema sanitario que utiliza en su hogar para la disposición y eliminación de excretas (heces y aguas negras)?", "opciones": ["Alcantarillado", "Tanque séptico", "Letrina", "Otros", "No tiene"]}, {"texto": "¿Dispone de un servicio de aseo formal para la recolección de basura en su comunidad?", "opciones": ["Sí", "No"]}, {"texto": "¿Alguna vez ha estado expuesto a plaguicidas en su trabajo, comunidad o lugar donde reside?", "opciones": ["Si", "No"]}]}, {"letra": "E", "titulo": "Preguntas relacionadas a hábitos y estilos de vida", "preguntas": [{"texto": "¿Realiza usted al menos 30 minutos de actividad física de intensidad moderada (caminar, pedalear, montar bicicleta, deportes, juegos, actividades recreativas, bailar, tareas domésticas) al día (Equivalente de 150 a 300 minutos semanales)?", "opciones": ["Sí, todos los días.", "Sí, algunos días de la semana.", "No realizo actividad física regularmente."]}, {"texto": "¿Ha fumado, masticado o aspirado algún producto derivado del tabaco, como cigarrillos, cigarrillo electrónico o vaper, tabaco de masticar durante los últimos 12 meses?", "opciones": ["Sí", "No"]}, {"texto": "¿Alguien fuma cerca de usted con frecuencia, en casa, el trabajo u otros lugares?", "opciones": ["Sí", "No"]}, {"texto": "¿Con qué frecuencia consume bebidas que contienen alcohol?", "opciones": ["Nunca", "Una o menos veces al mes.", "2 a 4 veces al mes", "2 a 3 veces por semana", "4 o más veces a la semana"]}]}], "fuente": "Fuente: ICGES, MINSA e INEC, 2019; OPS/NMH/19-001, 2019; Clasificación Nacional de Ocupaciones-2000; Ministerio de Economía y finanzas, 2010; Babor T, Higgins-Biddle J. Saunders J. y Monteiro M., 2001; MINSA, 2019; https://www.inec.gob.pa/archivos/P0705547520250124083204Comentarios%20EML%20octubre%202024.pdf", "edv_presentacion": ["Entornos de vida es una herramienta que se utiliza para mejorar la calidad de los lugares donde las personas viven, trabajan, se relacionan, envejecen…", "Es un cuestionario fácil y sencillo de usar. Consiste en 14 preguntas sobre elementos físicos, económicos y sociales del territorio a evaluar. Una vez contestadas, los resultados se trasladan a un simple diagrama en el que se muestra gráficamente la valoración sobre las áreas preguntadas.", "¿Por qué es importante el lugar donde vives?", "Los lugares donde pasamos gran parte de nuestro tiempo tienen un efecto importante sobre nuestra salud y bienestar. Conocer qué fortalezas y debilidades tiene nuestro entorno nos ayuda a pensar qué se necesita para mejorarlo. Las 14 dimensiones que incluye Entornos de vida están relacionadas con la salud y bienestar que nos proporciona nuestro entorno.", "¿Cómo se utiliza Entornos de Vida?", "La herramienta consta de 14 dimensiones. Cada dimensión tiene una pregunta principal y una serie de preguntas que te ayudarán a reflexionar sobre el tema. Una vez lo hayas valorado, deberás puntuarlo del 1 al 10 y explicar brevemente los motivos de tu puntuación.", "Cuando hayas evaluado las 14 dimensiones podrás traspasar tu puntuación al diagrama situado al final del cuestionario. De esta forma, y de un solo vistazo, verás cómo has evaluado tu entorno.", "Finalmente, podrás proponer acciones prioritarias que se pueden realizar para mejorar las áreas que peor has puntuado.", "Tú eres quien mejor conoce dónde vives,", "¿participas?", "Desplazamiento a pie o en bicicleta"], "edv_escala": "A continuación, puntúa mediante una escala del 1 a 10, donde 1 significa que no está en buenas condiciones y 10 significa que está en muy buenas condiciones. Registra tu valoración marcando con una X el número que consideres que refleja tu puntuación.", "dimensiones": [{"nombre": "Desplazamiento a pie o en bicicleta", "intro": "Caminar e ir en bicicleta son actividades que benefician nuestra salud y el medio ambiente. Poder realizar trayectos agradables y seguros nos anima a caminar o a ir en bicicleta.", "pregunta": "¿Puedes caminar y/o desplazarte en bicicleta (o en otro medio de transporte no motorizado) fácilmente y por trayectos agradables y seguros por tu barrio, corregimiento o distrito?", "reflexion": ["¿Hay zonas específicas para ir a caminar y/o montar en bicicleta (rutas señalizadas, circunvalaciones, caminos escolares, zonas peatonales, carriles bici…)?", "¿Las zonas para andar y/o montar en bicicleta tienen aceras amplias, buena señalización, rampas, sombra, asientos o banquetas, fuentes…? ¿Hay elementos que lo dificulten (postes, lámparas de alumbrado público, mobiliario urbano, pendiente excesiva, mal estado, poca separación de calzada, mucho tráfico, insuficiente seguridad vial…)?", "¿Tienen prioridad peatones o ciclistas frente a los coches u otros vehículos a motor (calles peatonales, semáforos y señalización específica)?", "¿Se puede ir caminando o en bicicleta a los colegios, universidad, tiendas, parques, o estaciones de transporte público (autobús, tren, metro…)?", "¿Tienen elementos que favorezcan la movilidad y la autonomía de todas las personas (ausencia de barreras arquitectónicas, asientos o banquetas, fuentes, baños públicos, sombra…), independientemente de la edad, el sexo género o la diversidad funcional?"]}, {"nombre": "Transporte público", "intro": "Poder acceder a un servicio de transporte público asequible, regular y bien conectado es importante para todas las personas. Un buen transporte público favorece realizar actividad física y anima a desplazarse de una forma más sostenible para el medio ambiente.", "pregunta": "¿El transporte público responde a las necesidades de todas las personas del barrio, corregimiento o distrito?", async function cargarLlave(file) {
  const pem = await file.text();
  const b64 = pem.replace(/-----[^-]+-----/g, "").replace(/\s+/g, "");
  if (!/BEGIN PRIVATE KEY/.test(pem)) throw new Error("El archivo no es una llave privada PKCS#8 (llave_privada.pem).");

}
async function abrirBytes(b) {

  const aes = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(n, n + 12) }, aes, b.slice(n + 12)));
}

    out.push({ nombre, datos: u.slice(ini, ini + tam) }); o = ini + tam;
  }
  return out;
}

  D.demo = true; D.entrevistas.clear(); D.consents.clear(); D.audios.clear(); D.trans.clear();
  let s = 7; const az = () => (s = (s * 16807) % 2147483647) / 2147483647, elige = n => Math.floor(az() * n);
  const razones = ["El bus pasa cada hora y de noche no hay transporte.", "Las aceras están rotas y no hay rampas.", "Hay un parque, pero sin luz por la noche.", "La junta comunal casi no convoca reuniones.", "Se va el agua casi todos los días en verano.", "Los vecinos se conocen y se ayudan.", "Hay trabajo en el campo, pero mal pagado.", ""];
  const encs = ["Estudiante A", "Estudiante B", "Estudiante C", "Estudiante D"];
  const plan = [["01", 46, 0.8], ["02", 52, 0.75], ["03", 21, 0.7]];
  const hoy = Date.now();
  plan.forEach(([cc, n, pc]) => { for (let k = 1; k <= n; k++) {
    const ini = new Date(hoy - (30 - Math.floor(az() * 30)) * 864e5 - elige(8) * 36e5);
    const fin = new Date(ini.getTime() + (30 + elige(35)) * 6e4);
    const est = az() < pc ? "c" : az() < 0.5 ? "a" : az() < 0.5 ? "r" : az() < 0.6 ? "e" : "n";
    const e = { codigo: `CIIGC-RD-CHI-${cc}-${String(k).padStart(2, "0")}`, tipo: "RD", provincia: "Chiriquí", comunidad: COMUS[cc], fecha: ini.toISOString().slice(0, 10), encuestador: encs[elige(4)],
      consent: est !== "n", consentAudio: az() < 0.7, consentT: ini.toISOString(), r: {}, edv: {}, razones: {}, problemas: ["", "", ""], acciones: ["", "", ""], audios: [], queja: { hubo: az() < 0.02, texto: "Ejemplo ficticio: la entrevista se alargó." }, notas: "",
      cerrada: est === "c", retirado: est === "r", motivoRetiro: est === "r" ? "Ejemplo ficticio: tuvo que salir." : "", inicio: est === "e" || est === "n" ? null : ini.toISOString(), fin: est === "c" ? fin.toISOString() : null, actualizada: fin.toISOString(), _origen: "demostración" };
    if (est === "c" || est === "a" || est === "r") {
      PREG.forEach(p => { if (est === "c" || az() < 0.4) e.r[p.clave] = elige(p.opciones.length); });
      INST.dimensiones.forEach((d, i) => { if (est === "c" || az() < 0.3) { e.edv[i + 1] = Math.max(1, Math.min(10, Math.round(5 + (az() - 0.5) * 7 + (cc === "03" ? 1.5 : 0)))); e.razones[i + 1] = razones[elige(razones.length)]; } });
      if (est === "c") { e.problemas = ["Transporte de noche", "Agua en verano", "Poca participación"]; e.acciones = ["Ruta nocturna", "Reparar el tanque", "Reunión con el representante"]; }
      if (e.consentAudio && est === "c") e.audios = [{ item: "D02", dur: 40 }, { item: "D12", dur: 35 }];
    }
    D.entrevistas.set(e.codigo, e);
  } });
  const ej = [["CIIGC-RD-CHI-01-03", "D02", "Mire, el bus de Alanje a David pasa cada hora y después de las seis ya no hay. Uno tiene que pagar taxi."],
    ["CIIGC-RD-CHI-02-05", "D12", "De día uno camina tranquilo, pero de noche la calle se pone oscura porque las lámparas están dañadas."],
    ["CIIGC-RD-CHI-03-02", "D14", "La junta comunal no convoca reuniones, y uno no sabe cómo hacerse escuchar."]];
  ej.forEach(([cod, item, t]) => D.trans.set(`${cod}_${item}_1`, { audio: `${cod}_${item}_1.m4a`, duracion_s: 30, modelo: "large-v3-turbo", borrador: true, texto: t, segmentos: [{ ini: 0, fin: 30, texto: t }] }));
  pintar(); toast("Datos de demostración cargados: todo es ficticio.");
}

function pintar() {
  $("#tabs").innerHTML = TABS.map(([k, t]) => `<button role="tab" aria-selected="${k === TAB}" data-tab="${k}">${t}</button>`).join("");
  const m = $("#modo");
  if (D.demo) { m.className = "chip activo"; m.textContent = "Demostración: datos ficticios"; }
  else if (D.entrevistas.size) { m.className = "chip completado"; m.textContent = `${D.entrevistas.size} entrevistas cargadas`; }
  else { m.className = "chip pendiente"; m.textContent = D.llave ? "Llave cargada" : "Sin datos"; }
  $("#app").innerHTML = V[TAB]();
}

  avance() {

    let rango = "sin encuestas aplicadas";
    if (aplicadas.length) { const mn = Math.min(...aplicadas.map(e => e.r.A2)), mx = Math.max(...aplicadas.map(e => e.r.A2)); rango = `de ${grupos[mn].match(/^\d+/)[0]} a ${/o más/.test(grupos[mx]) ? grupos[mx].match(/^\d+/)[0] + " años o más" : grupos[mx].match(/(\d+) años/)[1] + " años"} (por grupo de edad)`; }
    const quejas = L.filter(e => e.queja && e.queja.hubo);
    const texto = [`Reporte de seguimiento, ${fechaHora(new Date().toISOString()).split(",")[0]}. Chiriquí.`,
      `Sujetos enrolados o reclutados: ${c.enrolado}`, `Sujetos retirados del estudio: ${c.retirado}`, `Sujetos activos en el estudio: ${c.activo}`, `Sujetos completados: ${c.completado}`,

    const porEnc = {}; L.forEach(e => { const k = e.encuestador || "sin nombre"; (porEnc[k] = porEnc[k] || { t: 0, c: 0 }).t++; if (estado(e) === "completado") porEnc[k].c++; });

      if (e.consentAudio && estado(e) === "completado" && !(e.audios || []).length) o.push("autorizó grabar y no hay audios");
      if (e.queja && e.queja.hubo) o.push("queja registrada"); if (e.retirado) o.push("retirado: " + (e.motivoRetiro || "sin motivo"));
      return o; };
    const conObs = L.filter(e => obs(e).length);
    const durs = L.map(duracionMin).filter(x => x != null).sort((a, b) => a - b), med = durs.length ? durs[Math.floor(durs.length / 2)] : null;

      <div class="tarjeta tabla"><table><thead><tr><th>Código</th><th>Comunidad</th><th>Estado</th><th>Encuesta</th><th>Consentimiento</th></tr></thead><tbody>
      ${L.map(e => `<tr><td><b>${esc(e.codigo)}</b></td><td>${esc(e.comunidad)}</td><td>${chip(e)}</td><td><button class="btn chico" data-acc="ver-enc" data-k="${esc(e.codigo)}">Abrir</button></td>
        <td>${D.consents.has(e.codigo) ? `<button class="btn chico" data-acc="ver-cons" data-k="${esc(e.codigo)}">Abrir</button>` : `<span class="tenue">${D.demo ? "no en la demostración" : "falta el .edvc"}</span>`}</td></tr>`).join("")}</tbody></table></div></div>`;
  },

  exportar() {
    if (!D.entrevistas.size) return sinDatos();
    return `<div class="pila"><div><h1>Exportar</h1><p class="tenue">Archivos para el análisis. Se generan en este equipo; guárdelos en la carpeta privada del estudio, nunca en un repositorio.</p></div>
      <div class="rejilla">
        <div class="tarjeta"><h2>Base de respuestas</h2><p>Una fila por participante, separador punto y coma, abre en Excel y en R con <code>read.csv2()</code>.</p><button class="btn pri" data-acc="exp-csv">Descargar respuestas.csv</button></div>
        <div class="tarjeta"><h2>Transcripciones revisadas</h2><p>Código, ítem, estado, quién corrigió y verificó, y el texto. Para el análisis cualitativo del Anexo 8.</p><button class="btn pri" data-acc="exp-trans" ${D.trans.size ? "" : "disabled"}>Descargar transcripciones.csv</button></div>
        <div class="tarjeta"><h2>Estado de la revisión</h2><p>Para seguir revisando en otro equipo: se exporta aquí y se importa allá.</p><div class="btns"><button class="btn" data-acc="exp-rev">Exportar revisión</button><label class="btn">Importar revisión<input type="file" id="fRev" accept=".json" hidden></label></div></div>
      </div></div>`;
  },
};

// ---------------------------------------------------------------------------
// Encuesta en formato del instrumento (la misma que descarga la tableta)
// ---------------------------------------------------------------------------
function radarSVG(edv) {
  const W = 640, H = 600, cx = W / 2, cy = H / 2 + 6, R = 200, n = 14;
  const pt = (i, v) => { const a = -Math.PI / 2 + 2 * Math.PI * i / n, r = R * (v - 1) / 9; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%"><rect width="${W}" height="${H}" fill="#fff"/>`;
  for (let v = 2; v <= 10; v++) s += `<polygon points="${[...Array(n)].map((_, i) => pt(i, v).join(",")).join(" ")}" fill="none" stroke="#c9d3de" stroke-width="${v === 10 ? 1.5 : .8}"/>`;
  for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + 2 * Math.PI * i / n, lx = cx + (R + 22) * Math.cos(a), ly = cy + (R + 22) * Math.sin(a);
    s += `<text x="${lx}" y="${ly}" text-anchor="${Math.abs(Math.cos(a)) < .2 ? "middle" : Math.cos(a) > 0 ? "start" : "end"}" font-size="12" fill="#1b2633" font-family="Arial">${esc(INST.dimensiones[i].nombre)}</text>`; }
  const vals = [...Array(n)].map((_, i) => (edv || {})[i + 1] || 0);
  if (vals.some(Boolean)) s += `<polygon points="${vals.map((v, i) => pt(i, v || 1).join(",")).join(" ")}" fill="rgba(31,78,121,.22)" stroke="#1f4e79" stroke-width="2.5"/>`;
  return s + "</svg>";
}
function encuestaHTML(e) {
  const marca = on => on ? "☒" : "☐", r = e.r || {}, edv = e.edv || {}, raz = e.razones || {};
  const trans = it => [...D.trans.entries()].filter(([k]) => k.startsWith(e.codigo + "_" + it + "_")).map(([k, t]) => { const rv = REV[k] || {}; return `<p style="font-size:11px;color:#555;margin:6px 0 2px">Transcripción ${rv.estado === "verificado" ? "verificada" : rv.estado === "corregido" ? "corregida, sin verificar" : "automática (borrador)"}:</p><div style="border:1px dashed #1f4e79;background:#f2f6fa;padding:6px 8px;white-space:pre-wrap">${esc(rv.texto != null ? rv.texto : t.texto)}</div>`; }).join("");
  const css = `body{font:12.5px/1.45 Arial,sans-serif;color:#111;max-width:760px;margin:18px auto;padding:0 14px}h2{font-size:14px;background:#1f4e79;color:#fff;padding:5px 8px;margin:18px 0 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}h3{font-size:13px;margin:12px 0 4px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #555;padding:4px 6px;vertical-align:top}.op{margin:1px 0 1px 14px}.esc td{text-align:center;width:10%}.esc td.sel{background:#1f4e79;color:#fff;font-weight:bold;-webkit-print-color-adjust:exact;print-color-adjust:exact}.caja{border:1px solid #555;padding:6px 8px;min-height:30px;white-space:pre-wrap}.dim{page-break-inside:avoid}@page{size:letter;margin:14mm}`;
  const h = [`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Encuesta ${esc(e.codigo)}</title><style>${css}</style></head><body>`,
    `<table><tr><th colspan="4">Instrumento de Recolección de Datos</th></tr><tr><td colspan="4"><b>${esc(INST.titulo)}</b></td></tr>`,
    `<tr><td><b>Nombre del Encuestador:</b></td><td colspan="3">${esc(e.encuestador)}</td></tr><tr><td><b>Fecha de Aplicación:</b></td><td>${esc(e.fecha)}</td><td><b>Código de Participante:</b></td><td>${esc(e.codigo)}</td></tr>`,
    `<tr><td><b>Comunidad:</b></td><td>${esc(e.comunidad)}</td><td><b>Provincia:</b></td><td>${esc(e.provincia)}</td></tr></table>`, `<h2>${esc(INST.parte1_instruccion)}</h2>`];
  INST.parte1.forEach(s => { h.push(`<h3>${s.letra}. ${esc(s.titulo)}</h3>`); s.preguntas.forEach((q, i) => { const k = s.letra + (i + 1); h.push(`<div class="dim"><p style="margin:6px 0 2px"><b>${k}.</b> ${esc(q.texto)}</p>${q.opciones.map((o, j) => `<div class="op">${marca(r[k] === j)} ${esc(o)}</div>`).join("")}</div>`); }); h.push(trans(s.letra)); });
  h.push(`<h2>Entornos de vida</h2>`);
  INST.dimensiones.forEach((d, i) => { const n = i + 1, v = edv[n]; h.push(`<div class="dim"><h3>${n}. ${esc(d.nombre)}</h3><p><b>${esc(d.pregunta)}</b></p><table class="esc"><tr>${[...Array(10)].map((_, k) => `<td class="${v === k + 1 ? "sel" : ""}">${k + 1}</td>`).join("")}</tr></table><p style="margin:6px 0 2px">Razones de la valoración:</p><div class="caja">${esc(raz[n] || "")}</div>${trans("D" + String(n).padStart(2, "0"))}</div>`); });
  h.push(`<h2>Diagrama</h2><div style="max-width:520px;margin:0 auto">${radarSVG(edv)}</div>`);
  h.push(`<h2>Prioridades</h2><p><b>${esc(INST.prioridades.problemas)}</b></p>${(e.problemas || []).map((t, k) => `<div class="caja">${k + 1}) ${esc(t)}</div>`).join("")}<p><b>${esc(INST.prioridades.acciones)}</b></p>${(e.acciones || []).map((t, k) => `<div class="caja">${k + 1}) ${esc(t)}</div>`).join("")}${trans("P")}`);
  h.push(`<p style="font-size:11px;color:#555;border-top:1px solid #999;margin-top:18px;padding-top:4px">${esc(INST.gracias)} Instrumento ${esc(INST.version)}. Generado en la consola Entornos de Vida.</p></body></html>`);
  return h.join("\n");
}
function abrirDoc(html) { const w = window.open(URL.createObjectURL(new Blob([html], { type: "text/html" })), "_blank"); if (!w) toast("El navegador bloqueó la ventana: permita ventanas emergentes para este sitio."); }

// ---------------------------------------------------------------------------
// Exportación y portapapeles
// ---------------------------------------------------------------------------
function bajar(nombre, texto, tipo = "text/csv;charset=utf-8") { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto], { type: tipo })); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); }
const q = v => { const s = v == null ? "" : String(v); return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
function csvRespuestas() {
  const col = ["codigo", "fase", "provincia", "comunidad", "fecha", "encuestador", "estado", "motivo_retiro", "autoriza_grabacion", ...PREG.map(p => p.clave), ...INST.dimensiones.map((d, i) => "EdV" + String(i + 1).padStart(2, "0")), ...INST.dimensiones.map((d, i) => "razones" + String(i + 1).padStart(2, "0")), "problema1", "problema2", "problema3", "accion1", "accion2", "accion3", "queja", "duracion_min", "audios", "origen"];
  const filas = lista().map(e => [e.codigo, e.tipo, e.provincia, e.comunidad, e.fecha, e.encuestador, estado(e), e.motivoRetiro, e.consentAudio ? "sí" : "no", ...PREG.map(p => (e.r || {})[p.clave] != null ? p.opciones[e.r[p.clave]] : ""), ...INST.dimensiones.map((d, i) => (e.edv || {})[i + 1] || ""), ...INST.dimensiones.map((d, i) => (e.razones || {})[i + 1] || ""), ...(e.problemas || ["", "", ""]), ...(e.acciones || ["", "", ""]), e.queja && e.queja.hubo ? "sí" : "no", duracionMin(e) ?? "", (e.audios || []).length, e._origen].map(q).join(";"));
  return "﻿" + [col.join(";"), ...filas].join("\r\n");
}
function copiar(texto) {
  const ta = $("#portapapeles"); ta.value = texto; ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.blur();
  if (ok) return toast("Copiado.");
  if (navigator.clipboard) navigator.clipboard.writeText(texto).then(() => toast("Copiado."), () => toast("No se pudo copiar: selecciónelo a mano."));
}

// ---------------------------------------------------------------------------
// Eventos
// ---------------------------------------------------------------------------
async function cargarArchivos(files) {
  for (const f of files) {
    try { D.archivos.push({ txt: await procesarArchivo(f) }); }
    catch (err) { D.archivos.push({ txt: `${f.name}: ${err.message.startsWith("Primero") ? err.message : "no se pudo abrir (¿llave equivocada o archivo dañado?)"}`, mal: true }); }
  }
  if (D.demo && D.entrevistas.size) { /* al cargar datos reales se sale de la demostración */ }
  pintar();
}
document.addEventListener("change", async ev => {
  const t = ev.target;
  if (t.id === "fLlave" && t.files[0]) {
    try { if (D.demo) { D.demo = false; D.entrevistas.clear(); D.trans.clear(); D.audios.clear(); D.consents.clear(); } await cargarLlave(t.files[0]); toast("Llave cargada."); }
    catch (err) { toast(err.message || "No se pudo leer la llave."); }
    pintar();
  }
  if (t.id === "fArch") await cargarArchivos([...t.files]);
  if (t.id === "fRev" && t.files[0]) { try { const j = JSON.parse(await t.files[0].text()); Object.assign(REV, j); guardarRev(); toast("Revisión importada."); pintar(); } catch (e) { toast("Ese archivo no es una revisión exportada."); } }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "revisor") { REVISOR = t.value.trim(); try { localStorage.setItem("edv_revisor", REVISOR); } catch (e) {} }
  if (t.dataset.corr) { const k = t.dataset.corr; REV[k] = Object.assign({ estado: "borrador" }, REV[k], { texto: t.value }); guardarRev(); }
});
document.addEventListener("dragover", ev => { const z = ev.target.closest("#zona"); if (z) { ev.preventDefault(); z.classList.add("sobre"); } });
document.addEventListener("dragleave", ev => { const z = ev.target.closest("#zona"); if (z) z.classList.remove("sobre"); });
document.addEventListener("drop", async ev => { const z = ev.target.closest("#zona"); if (!z) return; ev.preventDefault(); z.classList.remove("sobre"); await cargarArchivos([...ev.dataTransfer.files]); });
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-acc]"); if (!b || b.disabled) return;
  const a = b.dataset.acc, k = b.dataset.k;
  if (a === "demo") { cargarDemo(); TAB = "avance"; pintar(); }
  if (a === "abrir-codigos") { const t = $("#tCod").value; if (!t.trim()) return; try { D.archivos.push({ txt: await procesarTexto(t, "texto pegado") }); } catch (err) { D.archivos.push({ txt: "texto pegado: " + err.message, mal: true }); } pintar(); }
  if (a === "copiar-rep") copiar($("#txtRep").textContent);
  if (a === "corregir" || a === "verificar") {
    if (!REVISOR) { toast("Escriba su nombre arriba antes de marcar."); $("#revisor").focus(); return; }
    const r = REV[k] = Object.assign({ texto: D.trans.get(k).texto }, REV[k]);
    if (a === "corregir") Object.assign(r, { estado: "corregido", corrector: REVISOR, fechaCorr: new Date().toISOString() });
    else { if (r.corrector === REVISOR) { toast("La verificación la hace una persona distinta de quien corrigió."); return; } Object.assign(r, { estado: "verificado", verificador: REVISOR, fechaVer: new Date().toISOString() }); }
    guardarRev(); pintar();
  }
  if (a === "reabrir-rev") { REV[k] = Object.assign({}, REV[k], { estado: "borrador", verificador: null }); guardarRev(); pintar(); }
  if (a === "ver-enc") abrirDoc(encuestaHTML(D.entrevistas.get(k)));
  if (a === "ver-cons") abrirDoc(D.consents.get(k));
  if (a === "exp-csv") bajar(`respuestas_${new Date().toISOString().slice(0, 10)}.csv`, csvRespuestas());
  if (a === "exp-trans") bajar(`transcripciones_${new Date().toISOString().slice(0, 10)}.csv`, "﻿" + [["audio", "codigo", "item", "estado", "corrector", "verificador", "texto"].join(";"), ...[...D.trans.entries()].sort().map(([kk, t]) => { const r = REV[kk] || {}; return [kk, kk.split("_")[0], kk.split("_")[1], r.estado || "borrador", r.corrector || "", r.verificador || "", r.texto != null ? r.texto : t.texto].map(q).join(";"); })].join("\r\n"));
  if (a === "exp-rev") bajar(`revision_transcripciones_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(REV, null, 1), "application/json");
});
pintar();
</script>
